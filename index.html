<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC09 Machine Reservation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SC09 Machine Reservation System</h1>
            <div class="controls">
                <button id="exportBtn" class="btn btn-secondary">📥 Export</button>
                <button id="importBtn" class="btn btn-secondary">📤 Import</button>
                <button id="resetBtn" class="btn btn-warning">🔄 Reset</button>
                <button id="refreshBtn" class="btn btn-primary">↻ Refresh</button>
            </div>
        </header>

        <div class="info-panel">
            <div class="info-item">
                <span class="label">Last Updated:</span>
                <span id="lastUpdated">-</span>
            </div>
            <div class="legend">
                <span class="legend-item"><span class="box available"></span> Available</span>
                <span class="legend-item"><span class="box reserved"></span> Reserved</span>
            </div>
        </div>

        <div id="reservationGrid" class="reservation-grid">
            <!-- Grid will be dynamically generated by JavaScript -->
        </div>

        <footer>
            <p>Click on an available card to reserve it. Click on a reserved card to view/release the reservation.</p>
        </footer>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="fileInput" accept=".json" style="display: none;">

    <script src="script.js"></script>
</body>
</html>
